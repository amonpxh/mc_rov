name: Secretos

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks (historial)
    runs-on: ubuntu-latest
    steps:
      - name: Obtener historial
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Binario oficial fijo y checksum independiente del archivo descargado.
      # No necesita licencia de una acción comercial ni acceso al servidor Odoo.
      - name: Verificar e instalar Gitleaks
        env:
          RUNNER_TOOL_DIR: ${{ runner.temp }}/gitleaks
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TOOL_DIR"
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TOOL_DIR/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TOOL_DIR/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TOOL_DIR/gitleaks.tar.gz" -C "$RUNNER_TOOL_DIR" gitleaks

      - name: Revisar historial sin mostrar secretos
        env:
          RUNNER_TOOL_DIR: ${{ runner.temp }}/gitleaks
        run: '"$RUNNER_TOOL_DIR/gitleaks" git --redact=100 --no-banner --exit-code=1 --log-opts="--all" .'
