# Test workflow for mc_rov
#
# Runs the 37 Odoo unit tests on the production VPS via a self-hosted runner.
# The runner must be installed on the VPS as the odoo user.
# See docs/runbooks/testing.md for the manual equivalent.

name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  odoo-tests:
    name: Odoo module tests (34 tests)
    runs-on: self-hosted
    timeout-minutes: 30

    steps:
      - name: Checkout into module path
        run: |
          git -C /opt/odoo/custom-addons/mc_rov fetch origin
          git -C /opt/odoo/custom-addons/mc_rov checkout ${{ github.sha }}

      - name: Run mc_rov tests
        run: |
          odoo \
            -d odoo_test \
            -u mc_rov \
            --test-tags /mc_rov \
            --stop-after-init \
            --no-http \
            --http-port 8199 \
            --workers 0 \
            --log-level test \
            --logfile "" \
            --config /etc/odoo/odoo.conf

      - name: Restore main
        if: always()
        run: git -C /opt/odoo/custom-addons/mc_rov checkout main
