# Test workflow for mc_rov
#
# Runs Odoo tests in the runner checkout against odoo_test.
# Never switches the branch or files served by production.
# See docs/runbooks/testing.md for the manual equivalent.

name: Tests

permissions:
  contents: read

concurrency:
  group: mc-rov-odoo-test
  cancel-in-progress: false

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  odoo-tests:
    name: Odoo module tests
    runs-on: self-hosted
    timeout-minutes: 30

    steps:
      - name: Checkout isolated module
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: ci-addons/mc_rov
          persist-credentials: false

      - name: Run mc_rov tests
        run: bash ci-addons/mc_rov/scripts/ci/run_odoo_tests.sh

      - name: Preserve Odoo test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: odoo-tests
          path: ${{ runner.temp }}/mc-rov-tests.*.log
          if-no-files-found: ignore
