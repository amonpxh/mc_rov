# Test workflow for mc_rov
#
# Runs the Odoo unit tests on the production VPS via a self-hosted runner.
# The runner must be installed on the VPS as the odoo user.
# See docs/runbooks/testing.md for the manual equivalent.

name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  odoo-tests:
    name: Odoo module tests
    runs-on: self-hosted
    timeout-minutes: 30

    steps:
      # En eventos pull_request, github.sha es el commit de merge que GitHub genera en
      # refs/pull/N/merge, una ref que `git fetch origin` no trae: el checkout fallaba
      # con "reference is not a tree". Se usa el head del PR, que sí viene con el fetch.
      - name: Checkout into module path
        env:
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git -C /opt/odoo/custom-addons/mc_rov fetch origin
          git -C /opt/odoo/custom-addons/mc_rov checkout "$SHA"

      - name: Run mc_rov tests
        run: |
          odoo \
            -d odoo_test \
            -u mc_rov \
            --test-tags /mc_rov \
            --stop-after-init \
            --no-http \
            --http-port 8199 \
            --workers 0 \
            --log-level test \
            --logfile "" \
            --config /etc/odoo/odoo.conf

      - name: Restore main
        if: always()
        run: git -C /opt/odoo/custom-addons/mc_rov checkout main
